# Idempotency rule pack.
#
# A tool annotated `idempotentHint: true` should produce the same
# response when called twice with the same input. This pack expands at
# run-time via `for_each_tool` and runs a single-call probe; the apply
# template asserts the envelope is well-formed and, when present,
# structuredContent is an object a downstream client can compare.
version: 3
metadata:
  name: idempotency
  description: "Probes idempotentHint=true tools for envelope stability."
  authors: ["wallfacer-core"]
  tags: [reliability, idempotency, mcp-spec]

invariants: []

for_each_tool:
  - name: "idempotency.envelope_is_stable.{{tool_name}}"
    where:
      annotations:
        idempotentHint: true
    apply:
      fixed: {}
      assert:
        # `isError` and `structuredContent` are optional in the MCP spec
        # (absent isError means false). JSON Schema `properties` only
        # constrains a field when it is present.
        - kind: matches_schema
          path: "$.response"
          schema:
            type: object
            required: [content]
            properties:
              isError: { type: boolean }
      test_fixtures:
        - name: "passes when envelope has isError"
          response: { isError: false, content: [{ type: "text", text: "ok" }] }
          expect: pass
        - name: "passes when isError is absent (spec default false)"
          response: { content: [{ type: "text", text: "ok" }] }
          expect: pass
        - name: "fails when isError is a string"
          response: { isError: "false", content: [{ type: "text", text: "ok" }] }
          expect: fail
        - name: "fails when content is missing"
          response: { isError: false }
          expect: fail

  - name: "idempotency.structured_content_is_object.{{tool_name}}"
    where:
      annotations:
        idempotentHint: true
    apply:
      fixed: {}
      assert:
        - kind: matches_schema
          path: "$.response"
          schema:
            type: object
            properties:
              structuredContent: { type: object }
      test_fixtures:
        - name: "passes when structuredContent is object"
          response: { isError: false, structuredContent: { ok: true } }
          expect: pass
        - name: "passes when structuredContent is absent (text-only tool)"
          response: { content: [{ type: "text", text: "ok" }] }
          expect: pass
        - name: "fails when structuredContent is a string"
          response: { isError: false, structuredContent: "scalar" }
          expect: fail
