# Tool-annotations rule pack.
#
# MCP 2025-06-18 introduced `tool.annotations.{readOnlyHint,
# destructiveHint, idempotentHint, openWorldHint}`. This pack iterates
# every tool the server declares and verifies the response envelope
# stays MCP-compliant under each annotation contract.
#
# v0.3.3 lesson — the previous invariants asserted that
# `readOnly`/`idempotent` tools never set `isError: true`, but that
# fires on any legitimate not-found / permission-denied response. A
# tool returning `isError: true` for a missing file is *correct
# behaviour*, not a violation of the read-only contract. The pack now
# focuses on the MCP wire-format properties that are verifiable
# without target-specific knowledge:
#
# * the response envelope is well-formed (a `content` array exists),
# * `openWorldHint` tools don't leak local filesystem paths in their
#   text content (a soft information-disclosure check).
#
# Stricter invariants (e.g. "destructive call requires confirmation
# token") are out of scope for a generic pack — they need per-server
# parametrisation in the operator's `wallfacer.toml`.
version: 3
metadata:
  name: tool-annotations
  description: "Verifies MCP tool annotations agree with envelope-shape contracts."
  authors: ["wallfacer-core"]
  tags: [security, annotations, mcp-spec]

invariants: []

for_each_tool:
  - name: "tool-annotations.envelope_well_formed.{{tool_name}}"
    # Every tool, regardless of annotations. The MCP spec requires a
    # `content` array on every successful response and on every
    # `isError: true` response.
    apply:
      input: schema_valid
      assert:
        - kind: matches_schema
          path: "$.response"
          schema:
            type: object
            required: [content]
            properties:
              content:
                type: array
      test_fixtures:
        - name: "passes for healthy success envelope"
          response: { isError: false, content: [{ type: "text", text: "ok" }] }
          expect: pass
        - name: "passes for graceful error envelope"
          response: { isError: true, content: [{ type: "text", text: "not found" }] }
          expect: pass
        - name: "fails when content array missing"
          response: { isError: true }
          expect: fail

  - name: "tool-annotations.open_world_no_internal_path_leak.{{tool_name}}"
    where:
      annotations:
        openWorldHint: true
    apply:
      input: schema_valid
      assert:
        # Open-world tools talk to remote services; the remote may emit
        # paths or stack traces. Reject those to keep the envelope
        # client-friendly. Bare `text` lookup; tools that return only
        # binary or non-text content trivially pass.
        - kind: any_of
          assert:
            - kind: not
              assertion:
                kind: is_type
                path: "$.response.content[0].text"
                type: string
            - kind: not
              assertion:
                kind: matches_regex
                path: "$.response.content[0].text"
                pattern: "(?:/Users/|/home/|C:\\\\\\\\Users)[^\\s]+"
      test_fixtures:
        - name: "passes when text is sanitised"
          response: { content: [{ type: "text", text: "service unavailable" }] }
          expect: pass
        - name: "passes when first content item has no text"
          response: { content: [{ type: "image", data: "..." }] }
          expect: pass
        - name: "fails when local path leaks"
          response:
            content:
              - { type: "text", text: "error at /home/server/app/main.py" }
          expect: fail
