# Phase K — scaffolded workflow for running wallfacer rule packs
# against external MCP servers on a schedule. NOT enabled by default:
# the targets, overrides, and reporting all need human curation. Edit
# the matrix below + uncomment the `schedule` trigger when you're ready
# to run it.
name: Real-world packs

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target id ('mcp-server-fetch', 'mcp-server-filesystem', or empty for all)"
        required: false
        default: ""
  # schedule:
  #   - cron: "0 7 * * 1"   # Mondays 07:00 UTC

permissions:
  contents: read
  issues: write             # to file findings as issues, when configured
  security-events: write    # to upload SARIF when configured

jobs:
  run-packs:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mcp-server-fetch
            install: pip install uv && uvx --help >/dev/null
            command: uvx
            args: '["mcp-server-fetch"]'
            packs: secrets-leakage unicode large-payload error-shape tool-annotations
          - id: mcp-server-filesystem
            install: npm install -g @modelcontextprotocol/server-filesystem
            command: mcp-server-filesystem
            args: '["/tmp"]'
            packs: secrets-leakage path-traversal large-payload error-shape tool-annotations

    steps:
      - name: Skip if a different target was requested
        id: filter
        run: |
          want="${{ github.event.inputs.target }}"
          if [ -n "$want" ] && [ "$want" != "${{ matrix.id }}" ]; then
            echo "::notice::skipping ${{ matrix.id }} (workflow_dispatch input requested '$want')"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.filter.outputs.skip == '0'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.filter.outputs.skip == '0'
      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.skip == '0'

      - name: Install wallfacer (workspace HEAD)
        if: steps.filter.outputs.skip == '0'
        run: cargo install --path crates/mcp-wallfacer-cli --locked

      - name: Install MCP target
        if: steps.filter.outputs.skip == '0'
        run: ${{ matrix.install }}

      - name: Configure wallfacer.toml
        if: steps.filter.outputs.skip == '0'
        run: |
          mkdir -p run/${{ matrix.id }}
          cat > run/${{ matrix.id }}/wallfacer.toml <<EOF
          [target]
          kind = "stdio"
          command = "${{ matrix.command }}"
          args = ${{ matrix.args }}
          timeout_ms = 5000
          EOF

      - name: Run packs
        if: steps.filter.outputs.skip == '0'
        run: |
          cd run/${{ matrix.id }}
          mkdir -p findings
          for pack in ${{ matrix.packs }}; do
            echo "::group::pack $pack"
            wallfacer property --pack "$pack" --format json --seed 0 > "findings/$pack.json" || true
            count=$(jq '.findings | length' "findings/$pack.json")
            echo "$pack: $count findings"
            echo "::endgroup::"
          done

      - name: Upload findings
        if: steps.filter.outputs.skip == '0'
        uses: actions/upload-artifact@v4
        with:
          name: findings-${{ matrix.id }}
          path: run/${{ matrix.id }}/findings/

      # When you're ready to file findings as issues, configure a
      # GH_TOKEN with `issues: write` and uncomment a step that posts
      # one issue per finding using `peter-evans/create-issue-from-file@v5`.
