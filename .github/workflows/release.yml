name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: wallfacer-x86_64-unknown-linux-gnu.tar.gz
            binary: wallfacer
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: wallfacer-aarch64-unknown-linux-gnu.tar.gz
            binary: wallfacer
          - os: macos-13
            target: x86_64-apple-darwin
            archive: wallfacer-x86_64-apple-darwin.tar.gz
            binary: wallfacer
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: wallfacer-aarch64-apple-darwin.tar.gz
            binary: wallfacer
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: wallfacer-x86_64-pc-windows-msvc.zip
            binary: wallfacer.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          tar -C dist -czf ${{ matrix.archive }} ${{ matrix.binary }}
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          Compress-Archive -Path dist/${{ matrix.binary }} -DestinationPath ${{ matrix.archive }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
