name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: wallfacer-x86_64-unknown-linux-gnu.tar.gz
            binary: wallfacer
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: wallfacer-aarch64-unknown-linux-gnu.tar.gz
            binary: wallfacer
          - os: macos-13
            target: x86_64-apple-darwin
            archive: wallfacer-x86_64-apple-darwin.tar.gz
            binary: wallfacer
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: wallfacer-aarch64-apple-darwin.tar.gz
            binary: wallfacer
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: wallfacer-x86_64-pc-windows-msvc.zip
            binary: wallfacer.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          tar -C dist -czf ${{ matrix.archive }} ${{ matrix.binary }}
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          Compress-Archive -Path dist/${{ matrix.binary }} -DestinationPath ${{ matrix.archive }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}

  publish-crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    # Only run on actual release tags (v*), not on workflow_dispatch reruns
    # of older tags or branches.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches workspace.package.version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          declared=$(grep -E '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $declared"
            exit 1
          fi
      - name: cargo publish (workspace)
        # `--workspace` was stabilised in cargo 1.81: cargo resolves the
        # crate dependency order itself (publishes wallfacer-core first,
        # waits for the index to refresh, then publishes mcp-wallfacer).
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
