name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: wallfacer-x86_64-unknown-linux-gnu.tar.gz
            binary: wallfacer
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: wallfacer-aarch64-unknown-linux-gnu.tar.gz
            binary: wallfacer
          # Cross-compile x86_64-apple-darwin from the Apple silicon
          # runner — macos-13 (Intel) free-tier runners are scarce and
          # often queue for hours. macos-latest hosts have the SDK to
          # build both targets.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: wallfacer-x86_64-apple-darwin.tar.gz
            binary: wallfacer
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: wallfacer-aarch64-apple-darwin.tar.gz
            binary: wallfacer
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: wallfacer-x86_64-pc-windows-msvc.zip
            binary: wallfacer.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          tar -C dist -czf ${{ matrix.archive }} ${{ matrix.binary }}
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          Compress-Archive -Path dist/${{ matrix.binary }} -DestinationPath ${{ matrix.archive }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}

  publish-crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    # Only run on actual release tags (v*), not on workflow_dispatch reruns
    # of older tags or branches.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches workspace.package.version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          declared=$(grep -E '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $declared"
            exit 1
          fi
      - name: cargo publish (workspace)
        # `--workspace` was stabilised in cargo 1.81: cargo resolves the
        # crate dependency order itself (publishes wallfacer-core first,
        # waits for the index to refresh, then publishes mcp-wallfacer).
        #
        # The maintainer often publishes manually from the laptop right
        # after tagging, which leaves this CI step racing the registry.
        # Treat "already uploaded" as success so the Release workflow
        # ends green when the version is already on crates.io. Any
        # *other* publish failure still fails the job.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          tmp=$(mktemp)
          if cargo publish --workspace --locked 2>&1 | tee "$tmp"; then
            exit 0
          fi
          # cargo prints both "already uploaded" (newer cargo) and
          # "crate version `X` is already uploaded" / "already exists"
          # (older variants). Any of these means the version is on the
          # registry already; the Release page already has the
          # binaries, so we surface a notice and exit 0.
          if grep -qE 'already (uploaded|exists|published)' "$tmp"; then
            echo "::notice::version already on crates.io — skipping publish"
            exit 0
          fi
          exit 1
