[target]
kind = "stdio"
command = "python3"
args = ["server.py"]
timeout_ms = 2000

[output]
corpus_dir = ".wallfacer/corpus"

# `crashes_now` and `record_delete` would be classified destructive by
# the default detector (keyword + annotation respectively). We allow
# them explicitly so the example exercises crash detection (the fuzz
# command) and the state-leak sequence (the stateful pack).
[allow_destructive]
tools = ["^crashes_now$", "^record_delete$"]

# ---- Phase I — pack overrides ----
# Point each pack at the witness tool that exists in this fixture.
[packs.secrets-leakage]
witness_tool = "bug_log"
witness_field = "text"

[packs.unicode]
witness_tool = "bug_log"
witness_field = "text"

[packs.large-payload]
string_witness_tool = "bug_log"
string_witness_field = "text"
array_witness_tool = "bug_log"
array_witness_field = "text"

[packs.prompt-injection]
llm_tool = "ask_llm"
prompt_field = "prompt"

[packs.injection-sql]
query_tool = "query_db"
query_field = "query"

[packs.injection-shell]
shell_tool = "run_shell"
shell_field = "command"

[packs.path-traversal]
read_file_tool = "read_file"
write_file_tool = "read_file"

# Phase L — point the stateful pack at the record_create / delete /
# read trio that demonstrates the leaky-delete bug.
[packs.stateful]
create_tool = "record_create"
delete_tool = "record_delete"
read_tool = "record_read"
