[workspace]
members = ["crates/wallfacer-core", "crates/mcp-wallfacer-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Runtime fuzzing and invariant-testing harness for MCP servers — catch crashes, hangs, schema drift, and state leaks before they ship."
repository = "https://github.com/lacausecrypto/mcp-wallfacer"
homepage = "https://github.com/lacausecrypto/mcp-wallfacer"
documentation = "https://docs.rs/wallfacer-core"
readme = "README.md"
keywords = ["mcp", "fuzzing", "testing", "validation", "security"]
categories = [
    "command-line-utilities",
    "development-tools::testing",
    "development-tools::debugging",
]

[workspace.dependencies]
anyhow = "1"
assert_cmd = ">=2, <2.1.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = ">=4.5, <4.6", features = ["derive", "env"] }
comfy-table = ">=7, <7.2"
async-trait = "0.1"
futures = "0.3"
globset = "0.4"
hex = "0.4"
http = "1"
indicatif = "0.18"
jsonschema = { version = "0.46", default-features = false, features = ["resolve-file"] }
predicates = ">=3, <3.2"
proptest = "1"
rand = "0.8"
rand_chacha = "0.3"
regex = "1"
rmcp = { version = "1.5", default-features = false, features = [
    "client",
    "transport-async-rw",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
panic = "warn"
