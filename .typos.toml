# typos configuration. https://github.com/crate-ci/typos
[default]
extend-ignore-re = [
    # Hex hashes / SHA256 fragments embedded in tests or fixtures.
    "[0-9a-f]{16,}",
]

[default.extend-words]
# Project-specific terms typos should not "correct".
crate = "crate"
clippy = "clippy"
rmcp = "rmcp"
wallfacer = "wallfacer"

[files]
extend-exclude = [
    "Cargo.lock",
    "out.sarif",
    ".wallfacer/**",
    "target/**",
    # The prompt-injection packs ship intentional multilingual + zero-
    # width + encoded payloads. Spanish "Ignora", German "alle / deine",
    # Turkish "sistem", and zero-width-split "Ig​nore" all read as
    # English typos to the spellchecker but are the test corpus by design.
    "crates/wallfacer-core/packs/prompt-injection*.yaml",
]
