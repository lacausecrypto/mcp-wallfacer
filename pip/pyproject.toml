[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-wallfacer"
version = "0.4.2"
description = "Runtime fuzzing and invariant-testing harness for MCP servers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "lacausecrypto" }]
keywords = ["mcp", "model-context-protocol", "fuzzing", "testing", "validation", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/lacausecrypto/mcp-wallfacer"
Repository = "https://github.com/lacausecrypto/mcp-wallfacer"
Issues = "https://github.com/lacausecrypto/mcp-wallfacer/issues"
Changelog = "https://github.com/lacausecrypto/mcp-wallfacer/blob/main/CHANGELOG.md"

[project.scripts]
wallfacer = "wallfacer_cli:main"

[tool.setuptools]
packages = ["wallfacer_cli"]
include-package-data = true
